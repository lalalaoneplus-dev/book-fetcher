<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #555;
      --line: #303030;
      --soft-line: #c9cdd3;
      --accent: #174f91;
      --accent-dark: #113c70;
      --paper: #fff;
      --wash: #f4f5f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 20px;
      line-height: 1.4;
    }

    main {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(36px, 7vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .search-form {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    input,
    button,
    .download,
    .page-button {
      min-height: 56px;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
    }

    input {
      min-width: 0;
      flex: 1;
      border: 2px solid var(--soft-line);
      padding: 12px 16px;
      font-weight: 500;
      color: var(--ink);
      background: var(--paper);
    }

    button,
    .download,
    .page-button {
      border: 2px solid var(--accent);
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:focus,
    input:focus,
    .download:focus,
    .page-button:focus {
      outline: 4px solid #111;
      outline-offset: 3px;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin: 0 0 18px;
      color: var(--muted);
    }

    #result-count { font-weight: 700; color: var(--ink); }

    .book-list {
      display: grid;
      gap: 18px;
    }

    .book-card {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .cover {
      width: 120px;
      aspect-ratio: 2 / 3;
      align-self: start;
      border: 1px solid var(--soft-line);
      object-fit: cover;
      background: var(--wash);
    }

    .cover-missing {
      color: transparent;
      background: var(--wash);
    }

    .book-details {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .book-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    .book-author {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 21px;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: auto;
    }

    .download:hover,
    button:hover,
    .page-button:hover { background: var(--accent-dark); }

    .pagination {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
    }

    .page-button {
      min-width: 150px;
    }

    .page-button[aria-disabled="true"] {
      border-color: #777;
      background: var(--paper);
      color: #777;
      pointer-events: none;
    }

    .message {
      padding: 28px;
      border: 2px dashed var(--soft-line);
      border-radius: 8px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 620px) {
      body { font-size: 18px; }
      main { padding: 22px 14px 40px; }
      h1 { margin-bottom: 18px; }
      .search-form { flex-direction: column; }
      .search-form button { width: 100%; }
      .book-card {
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 14px;
        padding: 14px;
      }
      .cover { width: 92px; }
      .book-title { font-size: 23px; }
      .book-author { font-size: 18px; margin-bottom: 16px; }
      .page-button { min-width: 0; flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Book Library</h1>

    <form class="search-form" id="search-form" role="search">
      <input id="search" type="search" aria-label="Search your book library" placeholder="Search your book library…" autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <div class="summary">
      <span id="result-count" aria-live="polite">Loading books…</span>
      <span id="page-count"></span>
    </div>

    <section class="book-list" id="book-list" aria-label="Books"></section>

    <nav class="pagination" aria-label="Library pages">
      <a class="page-button" id="previous" href="#">← Previous</a>
      <a class="page-button" id="next" href="#">Next →</a>
    </nav>
  </main>

  <script>
    (function () {
      var state = { page: 1, query: "", pages: 1 };
      var list = document.getElementById("book-list");
      var resultCount = document.getElementById("result-count");
      var pageCount = document.getElementById("page-count");
      var previous = document.getElementById("previous");
      var next = document.getElementById("next");
      var search = document.getElementById("search");

      function make(tag, className, text) {
        var element = document.createElement(tag);
        if (className) element.className = className;
        if (text) element.textContent = text;
        return element;
      }

      function renderBook(book) {
        var card = make("article", "book-card");
        var cover = make("img", "cover");
        cover.src = book.cover;
        cover.alt = "Cover of " + book.title;
        cover.loading = "lazy";
        cover.addEventListener("error", function () {
          cover.removeAttribute("src");
          cover.alt = "";
          cover.className += " cover-missing";
        });

        var details = make("div", "book-details");
        var title = make("h2", "book-title", book.title);
        var author = make("p", "book-author", "by " + book.author);
        var download = make("a", "download", "Download AZW3");
        download.href = book.download;
        download.setAttribute("aria-label", "Download " + book.title + " as AZW3");

        details.appendChild(title);
        details.appendChild(author);
        details.appendChild(download);
        card.appendChild(cover);
        card.appendChild(details);
        return card;
      }

      function setDisabled(link, disabled) {
        link.setAttribute("aria-disabled", disabled ? "true" : "false");
        link.tabIndex = disabled ? -1 : 0;
      }

      function loadBooks() {
        list.innerHTML = '<div class="message">Loading your library…</div>';
        var url = "/api/books?page=" + state.page + "&query=" + encodeURIComponent(state.query);

        fetch(url, { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("Library request failed");
            return response.json();
          })
          .then(function (data) {
            state.pages = data.pages;
            list.textContent = "";
            if (!data.books.length) {
              list.appendChild(make("div", "message", "No matching books found."));
            } else {
              data.books.forEach(function (book) { list.appendChild(renderBook(book)); });
            }
            resultCount.textContent = data.total + (data.total === 1 ? " book found" : " books found");
            pageCount.textContent = data.pages > 1 ? "Page " + data.page + " of " + data.pages : "";
            setDisabled(previous, data.page <= 1);
            setDisabled(next, data.page >= data.pages);
            window.scrollTo(0, 0);
          })
          .catch(function () {
            list.textContent = "";
            list.appendChild(make("div", "message", "The Calibre library is temporarily unavailable."));
            resultCount.textContent = "Could not load books";
            pageCount.textContent = "";
            setDisabled(previous, true);
            setDisabled(next, true);
          });
      }

      document.getElementById("search-form").addEventListener("submit", function (event) {
        event.preventDefault();
        state.query = search.value.trim();
        state.page = 1;
        loadBooks();
      });

      previous.addEventListener("click", function (event) {
        event.preventDefault();
        if (state.page > 1) { state.page -= 1; loadBooks(); }
      });

      next.addEventListener("click", function (event) {
        event.preventDefault();
        if (state.page < state.pages) { state.page += 1; loadBooks(); }
      });

      loadBooks();
    }());
  </script>
</body>
</html>
